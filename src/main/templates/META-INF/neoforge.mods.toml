modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"
issueTrackerURL="https://github.com/tturnover/fogged/issues"

[[mixins]]
config="fogged.mixins.json"

# Optional, and separate on purpose: it targets Particle Rain's own classes, so it must be allowed to
# not apply at all when that mod is absent.
[[mixins]]
config="fogged.particlerain.mixins.json"

# Likewise optional: it targets Iris' shader compiler.
[[mixins]]
config="fogged.iris.mixins.json"

# Likewise optional: it targets Sodium's terrain renderer.
[[mixins]]
config="fogged.sodium.mixins.json"

# Likewise optional: it targets Thirst Was Taken's thirst tracker. Common, not client: thirst is
# server-side.
[[mixins]]
config="fogged.thirst.mixins.json"

# Likewise optional: it targets Cold Sweat's hearth. Common: the hearth burns server-side.
[[mixins]]
config="fogged.coldsweat.mixins.json"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
displayURL="https://github.com/tturnover/fogged"
logoFile="fogged-icon.png"
authors="tturnover"
description='''
Adds a breathing boundary: below a configurable Y height you breathe as if underwater and the world
fogs over like a low render distance, with a coloured separation plane marking the surface.
'''

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
